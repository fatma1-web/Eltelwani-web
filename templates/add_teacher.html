<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>إضافة معلم - دار التلوانى</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>

<main class="qa-container">

    <h2>👨‍🏫 إضافة معلم جديد</h2>

    <p>
        إضافة بيانات معلم جديد إلى دار التلوانى
    </p>

    <hr>


    <form method="POST">

        <label>اسم المعلم</label>

        <input
            type="text"
            name="fullName"
            placeholder="اسم المعلم"
            required>


        <br><br>


        <label>رقم الهاتف</label>

        <input
    type="tel"
    name="phone"
    pattern="01[0-9]{9}"
    maxlength="11"
    minlength="11"
    inputmode="numeric"
    required
>


        <br><br>


        <label>السن</label>

        <input
            type="number"
            name="age"
            placeholder="سن المعلم"
            min="18">


        <br><br>


        <label>المؤهل الدراسي / الكلية</label>

        <input
            type="text"
            name="qualification"
            placeholder="مثال: كلية الشريعة الإسلامية">


        <br><br>


        <label>التخصص</label>

        <input
            type="text"
            name="specialization"
            placeholder="مثال: شريعة إسلامية">


        <br><br>



        <label>مدة الخبرة في تحفيظ القرآن</label>

        <input
            type="number"
            name="quran_experience"
            placeholder="عدد سنوات الخبرة"
            min="0">


        <br><br>


        <label>الإجازة / القراءة</label>

        <input
            type="text"
            name="ijazah"
            placeholder="مثال: حفص عن عاصم">


        <br><br>


        <label>ملاحظات</label>

        <textarea
            name="notes"
            placeholder="أي ملاحظات خاصة بالمعلم"
            rows="4"></textarea>


        <br><br>


        <label>كلمة المرور</label>

        <input
            type="password"
            name="password"
            placeholder="كلمة المرور"
            required>


        <br><br>


        <button type="submit">
            💾 حفظ المعلم
        </button>

    </form>


    <br>


    <a href="{{ url_for('admin_teachers') }}"
       class="back-btn">

        ⬅️ العودة إلى المعلمين

    </a>

</main>

</body>

</html>
