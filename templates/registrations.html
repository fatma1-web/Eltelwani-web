<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <title>استمارات التسجيل</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="top-nav-container">

        <a href="{{ url_for('admin') }}"
           class="back-btn">
            ⬅️ العودة للوحة التحكم
        </a>

    </div>


    <main class="qa-container">

        <h2>📋 استمارات التسجيل</h2>

        <p>
            جميع الطلبات التي تم إرسالها من صفحة التسجيل.
        </p>

        <hr>


        <div id="registrationsContainer">

            جاري تحميل الاستمارات...

        </div>

    </main>



    <script>

        const ADMIN_PASSWORD = "123";


        function checkPassword() {

            const userPass = prompt(
                "برجاء إدخال كلمة سر الأدمن:"
            );

            if (userPass !== ADMIN_PASSWORD) {

                alert("كلمة السر خاطئة!");

                window.location.href =
                    "{{ url_for('home') }}";

                return false;
            }

            return true;
        }



        function approveRegistration(id) {

            const confirmed = confirm(
                "هل تريد اعتماد هذا الطالب وإنشاء حساب الطالب وولي الأمر؟"
            );

            if (!confirmed) {
                return;
            }


            fetch(
                `/admin/registrations/approve/${id}`,
                {
                    method: "POST"
                }
            )

            .then(function(response) {

                return response.json();

            })

            .then(function(data) {

                if (data.message) {

                    alert(data.message);

                }

                if (data.student_code) {

                    alert(
                        "كود الطالب: " +
                        data.student_code +
                        "\n" +
                        "كلمة مرور الطالب: 123\n" +
                        "كلمة مرور ولي الأمر: 123"
                    );

                }

                loadRegistrations();

            })

            .catch(function(error) {

                console.error(error);

                alert(
                    "حدث خطأ أثناء اعتماد الطالب."
                );

            });

        }



        function loadRegistrations() {

            const container =
                document.getElementById(
                    "registrationsContainer"
                );


            container.innerHTML =
                "جاري تحميل الاستمارات...";


            fetch("/api/admin/registrations")

                .then(function(response) {

                    if (!response.ok) {

                        throw new Error(
                            "HTTP Error " +
                            response.status
                        );

                    }

                    return response.json();

                })

                .then(function(data) {

                    container.innerHTML = "";


                    if (!data || data.length === 0) {

                        container.innerHTML = `

                            <p style="
                                text-align:center;
                                color:#777;
                                font-weight:bold;
                            ">

                                لا توجد استمارات حتى الآن.

                            </p>

                        `;

                        return;
                    }



                    data.forEach(function(registration) {

                        const card =
                            document.createElement("div");

                        card.className =
                            "admin-card";


                        let statusHTML = "";


                        if (
                            registration.status ===
                            "approved"
                        ) {

                            statusHTML = `

                                <p style="
                                    color:green;
                                    font-weight:bold;
                                ">

                                    ✅ تم اعتماد الطالب

                                    ${
                                        registration.student_code
                                        ? " - كود الطالب: " +
                                          registration.student_code
                                        : ""
                                    }

                                </p>

                            `;

                        }

                        else {

                            statusHTML = `

                                <p style="
                                    color:#c88a00;
                                    font-weight:bold;
                                ">

                                    ⏳ في انتظار الاعتماد

                                </p>


                                <button
                                    onclick="
                                        approveRegistration(
                                            ${registration.id}
                                        )
                                    "
                                    style="
                                        margin-top:15px;
                                        padding:10px 20px;
                                        border:none;
                                        border-radius:8px;
                                        cursor:pointer;
                                        font-weight:bold;
                                    "
                                >

                                    ✅ اعتماد الطالب

                                </button>

                            `;

                        }



                        card.innerHTML = `

                            <h3>
                                👤 ${registration.fullName}
                            </h3>


                            <p>

                                <strong>
                                    رقم التسجيل:
                                </strong>

                                ${registration.id}

                            </p>


                            <p>

                                <strong>
                                    العمر:
                                </strong>

                                ${registration.age || "-"}

                            </p>


                            <p>

                                <strong>
                                    النوع:
                                </strong>

                                ${registration.gender || "-"}

                            </p>


                            <p>

                                <strong>
                                    الهاتف:
                                </strong>

                                ${registration.phone || "-"}

                            </p>


                            <p>

                                <strong>
                                    رقم ولي الأمر:
                                </strong>

                                ${registration.parent_phone || "-"}

                            </p>


                            <p>

                                <strong>
                                    الكورس:
                                </strong>

                                ${registration.course || "-"}

                            </p>


                            <p>

                                <strong>
                                    طريقة الدراسة:
                                </strong>

                                ${registration.way || "-"}

                            </p>


                            <p>

                                <strong>
                                    الحلقة:
                                </strong>

                                ${registration.halaqa || "-"}

                            </p>


                            <p>

                                <strong>
                                    المستوى:
                                </strong>

                                ${registration.level || "-"}

                            </p>


                            <p>

                                <strong>
                                    الأيام:
                                </strong>

                                ${registration.day || "-"}

                            </p>


                            <p>

                                <strong>
                                    ملاحظات:
                                </strong>

                                ${registration.notes || "-"}

                            </p>


                            <hr>


                            <small>

                                تاريخ التسجيل:

                                ${registration.created_at || "-"}

                            </small>


                            ${statusHTML}

                        `;


                        container.appendChild(card);

                    });

                })


                .catch(function(error) {

                    console.error(error);


                    container.innerHTML = `

                        <p style="
                            color:red;
                            text-align:center;
                        ">

                            ❌ حدث خطأ أثناء تحميل الاستمارات.

                            <br>

                            تأكدي أن Flask و MySQL يعملان.

                        </p>

                    `;

                });

        }



        if (checkPassword()) {

            loadRegistrations();

        }

    </script>

</body>

</html>
