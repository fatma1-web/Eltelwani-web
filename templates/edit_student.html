<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>تعديل بيانات الطالب - دار التلوانى</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>

<main class="qa-container">

    <h2>✏️ تعديل بيانات الطالب</h2>

    <p>
        تعديل بيانات:
        <strong>{{ student.fullName }}</strong>
    </p>

    <hr>


    <form method="POST">


        <label>اسم الطالب</label>

        <input
            type="text"
            name="fullName"
            value="{{ student.fullName }}"
            required>


        <br><br>


        <label>كود الطالب</label>

        <input
            type="text"
            name="student_code"
            value="{{ student.student_code or '' }}"
            required>


        <br><br>


        <label>رقم الهاتف</label>

        <input
            type="tel"
            name="phone"
            pattern="01[0-9]{9}"
            maxlength="11"
            minlength="11"
            inputmode="numeric"
            value="{{ student.phone }}"
            required>


        <br><br>


        <label>رقم ولي الأمر</label>

        <input
            type="tel"
            name="parent_phone"
            pattern="01[0-9]{9}"
            maxlength="11"
            minlength="11"
            inputmode="numeric"
            value="{{ student.parent_phone or '' }}"
            required>


        <br><br>


        <label>الحلقة</label>

        <input
            type="text"
            name="halaqa"
            value="{{ student.halaqa or '' }}">


        <br><br>


<label>المعلم المسؤول</label>

<select name="teacher_id">

    <option value="">
        -- بدون معلم --
    </option>

    {% for teacher in teachers %}

        <option
            value="{{ teacher.id }}"
            {% if student.teacher_id == teacher.id %}
                selected
            {% endif %}
        >
            {{ teacher.fullName }}
        </option>

    {% endfor %}

</select>

<br><br>


        <label>المستوى</label>

        <input
            type="text"
            name="level"
            value="{{ student.level or '' }}">


        <br><br>


        <label>مقدار الحفظ</label>

        <input
            type="text"
            name="memorized"
            value="{{ student.memorized or '' }}">


        <br><br>


        <label>المتبقي للختم</label>

        <input
            type="text"
            name="remaining"
            value="{{ student.remaining or '' }}">


        <br><br>


        <label>كلمة المرور</label>

        <input
            type="text"
            name="password"
            value="{{ student.password }}"
            required>


        <br><br>


        <button type="submit">
            💾 حفظ التعديلات
        </button>


    </form>


    <br>


    <a href="{{ url_for('admin_students') }}"
       class="back-btn">

        ⬅️ العودة إلى الطلاب

    </a>

</main>

</body>

</html>
