<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>إدارة الطلاب - دار التلوانى</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>

        .students-page {
            max-width: 1100px;
            margin: 50px auto;
            padding: 25px;
        }

        .students-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .students-title h1 {
            margin: 0 0 8px;
            font-size: 32px;
        }

        .students-title p {
            margin: 0;
            opacity: 0.8;
        }

        .add-student-btn {
            display: inline-block;
            padding: 13px 22px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            background: #c9a227;
            color: #111;
            transition: 0.3s;
        }

        .add-student-btn:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        .students-count {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(201, 162, 39, 0.4);
            border-radius: 12px;
            padding: 18px 22px;
            margin-bottom: 25px;
        }

        .students-count span {
            font-size: 28px;
            font-weight: bold;
            color: #c9a227;
        }

        .students-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .student-card {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(201, 162, 39, 0.35);
            border-radius: 16px;
            padding: 22px;
            transition: 0.3s;
        }

        .student-card:hover {
            transform: translateY(-4px);
            border-color: #c9a227;
        }

        .student-icon {
            width: 55px;
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(201, 162, 39, 0.15);
            font-size: 25px;
            margin-bottom: 15px;
        }

        .student-card h3 {
            margin: 0 0 15px;
            font-size: 21px;
        }

        .student-info {
            display: flex;
            flex-direction: column;
            gap: 9px;
            opacity: 0.9;
        }

        .student-info strong {
            color: #c9a227;
        }

        .student-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .student-actions button {
            flex: 1;
            padding: 9px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
        }

        .back-dashboard {
            display: inline-block;
            margin-top: 30px;
            text-decoration: none;
        }

        @media (max-width: 600px) {

            .students-header {
                flex-direction: column;
                align-items: stretch;
            }

            .add-student-btn {
                text-align: center;
            }

            .students-page {
                margin: 20px auto;
                padding: 15px;
            }

        }

    </style>

</head>


<body>

<main class="students-page">


    <div class="students-header">

        <div class="students-title">

            <h1>👨‍🎓 إدارة الطلاب</h1>

            <p>
                متابعة وإدارة بيانات طلاب دار التلوانى
            </p>

        </div>


         <a href="{{ url_for('add_student') }}"class="add-student-btn">

            ➕ إضافة طالب

        </a>

    </div>


    <div class="students-count">

        <span id="studentsCount">0</span>

        <span style="font-size: 16px; color: inherit;">
            طالب مسجل
        </span>

    </div>


    <div id="studentsList" class="students-grid">

        جاري تحميل بيانات الطلاب...

    </div>


    <a href="{{ url_for('admin_dashboard') }}"
       class="back-dashboard">

        ⬅️ العودة إلى لوحة التحكم

    </a>


</main>


<script>

async function loadStudents() {

    try {

        const response =
            await fetch("/api/admin/students");

        const students =
            await response.json();


        const container =
            document.getElementById("studentsList");

        const count =
            document.getElementById("studentsCount");


        if (!response.ok) {

            container.innerHTML =
                "<p>لا يمكن تحميل بيانات الطلاب.</p>";

            return;

        }


        count.textContent = students.length;


        if (students.length === 0) {

            container.innerHTML = `
                <p>
                    لا يوجد طلاب مسجلون حاليًا.
                </p>
            `;

            return;

        }


        container.innerHTML = students.map(student => `

    <div class="student-card">

        <div class="student-icon">
            👨‍🎓
        </div>

        <h3>
            ${student.fullName}
        </h3>

        <div class="student-info">

            <div>
                <strong>الكود:</strong>
                ${student.student_code || "-"}
            </div>

            <div>
                <strong>الهاتف:</strong>
                ${student.phone || "-"}
            </div>

            <div>
                <strong>ولي الأمر:</strong>
                ${student.parent_phone || "-"}
            </div>

            <div>
                <strong>الحلقة:</strong>
                ${student.halaqa || "غير محددة"}
            </div>

            <div>
                <strong>المستوى:</strong>
                ${student.level || "غير محدد"}
            </div>

            <div>
    <strong>المعلم المسؤول:</strong>
    ${student.teacher_name || "لم يتم تعيين معلم"}
</div>

            <div>
                <strong>الحفظ:</strong>
                ${student.memorized || "لم يُحدد"}
            </div>

            <div>
                <strong>المتبقي للختم:</strong>
                ${student.remaining || "لم يُحدد"}
            </div>

        </div>

        <div class="student-actions">

            <a href="/admin/students/edit/${student.id}"
               style="text-decoration: none;">

                <button type="button">
                    ✏️ تعديل
                </button>

            </a>


            <form
                action="/admin/students/delete/${student.id}"
                method="POST"
                onsubmit="return confirm('هل أنتِ متأكدة من حذف هذا الطالب؟');">

                <button type="submit">
                    🗑️ حذف
                </button>

            </form>

        </div>

    </div>

`).join("");    
    


    } catch (error) {

        document.getElementById("studentsList").innerHTML =
            "<p>حدث خطأ أثناء الاتصال بالسيرفر.</p>";

        console.error(error);

    }

}


loadStudents();

</script>


</body>

</html>
