<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>تسجيل الدخول - دار التلوانى</title>

<link rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}">


</head>

<body>

<main class="qa-container">

    <h2>🔐 تسجيل الدخول</h2>

    <p>
        مرحبًا بك في نظام دار التلوانى
    </p>

    <form action="{{ url_for('login') }}"
          method="POST">

        <label>
            رقم الهاتف
        </label>

        <input
            type="tel"
            name="phone"
            placeholder="أدخل رقم الهاتف"
            required
        >

        <br>

        <label>
            كلمة المرور
        </label>

        <input
            type="password"
            name="password"
            placeholder="أدخل كلمة المرور"
            required
        >

        <br>

        <input
            type="submit"
            value="تسجيل الدخول"
        >

    </form>

    <br>

    <a href="{{ url_for('home') }}"
       class="back-btn">

        ⬅️ العودة للصفحة الرئيسية

    </a>

</main>

</body>

</html>
